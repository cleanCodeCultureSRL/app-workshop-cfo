# /etc/nginx/sites-available/freedom-number
# HTTP răspunde doar la verificarea Let's Encrypt și redirecționează la HTTPS.
# Nginx termină TLS-ul, servește bundle-ul static din disc și trimite restul (inclusiv /ws) la Node pe 127.0.0.1:8794.

server {
    listen 80;
    listen [::]:80;
    server_name app.cfo.cleancodeculture.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.cfo.cleancodeculture.com;

    ssl_certificate     /etc/letsencrypt/live/app.cfo.cleancodeculture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.cfo.cleancodeculture.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CfoAppSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/freedom-number.conf;
}
