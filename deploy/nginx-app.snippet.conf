# /etc/nginx/snippets/freedom-number.conf
# Partea comună (HTTP și HTTPS): static din disc + proxy la Node.

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location /assets/ {
    alias /var/www/freedom-number/dist/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://127.0.0.1:8794;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket-ul stă deschis cât ține sesiunea.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
