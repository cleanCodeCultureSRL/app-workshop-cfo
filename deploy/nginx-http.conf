# /etc/nginx/sites-available/freedom-number  (varianta fără certificat, până obținem Let's Encrypt)

server {
    listen 80;
    listen [::]:80;
    server_name app.cfo.cleancodeculture.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include /etc/nginx/snippets/freedom-number.conf;
}
