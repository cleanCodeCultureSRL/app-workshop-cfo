# CI/CD: la fiecare push pe main se verifică build-ul, apoi se publică pe VPS
# (app.cfo.cleancodeculture.com) exact ca deploy/push.sh: rsync + deploy/remote.sh pe server.
# Secrete necesare în repo: VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configurare SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Sincronizare fișiere
        run: |
          rsync -az --delete \
            --exclude .git --exclude .github --exclude node_modules --exclude dist --exclude data --exclude .env \
            ./ "root@${{ secrets.VPS_HOST }}:/var/www/freedom-number/"
      - name: Build și restart pe server
        shell: bash  # pipefail: un eșec pe server pică job-ul
        run: ssh "root@${{ secrets.VPS_HOST }}" 'bash /var/www/freedom-number/deploy/remote.sh' | grep -v '^PIN prezentator'
